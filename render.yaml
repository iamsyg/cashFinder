services:
  - type: web
    name: cashfinder-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -m app.ml.train_model
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
